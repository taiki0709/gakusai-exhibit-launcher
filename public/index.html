<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>展示ランチャー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="home">
  <header>
    <div class="head">
      <h1 id="title">展示ランチャー</h1>
      <div class="sub">見たい作品を押してください</div>
    </div>
    <aside id="qr" hidden>
      <img id="qrimg" alt="展示内容を見るための QR コード">
      <div>
        <div class="t">スマホで展示内容を<br>見られます</div>
        <div class="s">カメラで読み取ってください</div>
      </div>
    </aside>
    <div class="count" id="count"></div>
  </header>
  <div class="body">
    <div id="grid"></div>
  </div>
</section>

<section id="viewer" hidden>
  <div class="stage">
    <img id="vimg" alt="" hidden>
    <video id="vvideo" controls playsinline hidden></video>
    <div class="notice" id="vnotice" hidden></div>
  </div>
  <div class="bar">
    <button class="btn" id="back">一覧へ<span class="key">Esc</span></button>
    <button class="btn" id="prev" aria-label="前へ">◀</button>
    <span class="pager" id="pager"></span>
    <button class="btn" id="next" aria-label="次へ">▶</button>
    <div class="info"><span class="vno" id="vno"></span><div class="txt"><div class="t" id="vtitle"></div><div class="a" id="vauthor"></div></div></div>
    <button class="btn watch" id="watch" hidden>▶ 動画を再生</button>
    <button class="btn play" id="play" hidden>遊ぶ<span class="key">Enter</span></button>
  </div>
</section>

<section id="playing" hidden>
  <div>
    <!-- 動くロボットアーム(起動中の目印) -->
    <svg viewBox="0 0 220 190" aria-hidden="true">
      <rect x="60" y="165" width="80" height="16" rx="3" fill="#111"/>
      <rect x="84" y="150" width="32" height="18" rx="3" fill="#111"/>
      <g class="arm-upper">
        <rect x="92" y="82" width="16" height="70" rx="8" fill="#111"/>
        <circle cx="100" cy="150" r="10" fill="#fff" stroke="#111" stroke-width="3"/>
        <g class="arm-fore">
          <rect x="100" y="74" width="68" height="16" rx="8" fill="#111"/>
          <circle cx="100" cy="82" r="9" fill="#fff" stroke="#111" stroke-width="3"/>
          <g class="arm-hand">
            <circle cx="166" cy="82" r="7" fill="#fff" stroke="#111" stroke-width="3"/>
            <rect x="172" y="68" width="22" height="7" rx="3" fill="#7C7C7C"/>
            <rect x="172" y="89" width="22" height="7" rx="3" fill="#7C7C7C"/>
          </g>
        </g>
      </g>
    </svg>
    <p>起動しています</p>
    <div class="t" id="ptitle"></div>
    <p>遊び終わったら、ゲームの画面を閉じてください。</p>
    <p class="time" id="ptime"></p>
  </div>
</section>

<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
